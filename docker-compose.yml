services:
  # ==========================================
  # 1. Express TypeScript Application Service
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_app
    ports:
      - "8000:8000" # Maps port 8000 on host to 8000 in container
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy # Wait until MySQL is ready and passing health check
    restart: always

  # ==========================================
  # 2. MySQL Database Service
  # ==========================================
  db:
    image: mysql:8.4 # Automatically downloads official MySQL 8.4 image from Docker Hub
    container_name: mysql_db
    ports:
      - "3306:3306" # Maps MySQL default port to host
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-express_db}
    volumes:
      - db_data:/var/lib/mysql # Persists MySQL database data locally
    restart: always
    # Health check ensures MySQL is fully initialized before the App connects
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # 3. phpMyAdmin UI Service
  # ==========================================
  phpmyadmin:
    image: phpmyadmin:5 # Automatically downloads version 5 phpMyAdmin image
    container_name: phpmyadmin_ui
    ports:
      - "8080:80" # Access phpMyAdmin in your browser at http://localhost:8080
    environment:
      PMA_HOST: db # Pre-selects the 'db' server, but requires you to enter username & password manually
      PMA_PORT: 3306
    depends_on:
      - db
    restart: always

# ==========================================
# Named Volumes (Data Persistence)
# ==========================================
volumes:
  db_data: # Ensures database records are saved even if containers stop
