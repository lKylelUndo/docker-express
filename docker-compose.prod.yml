services:
  # ==========================================
  # 1. Express TypeScript Application Service
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # No target specified = uses final stage ('runner') from multi-stage Dockerfile
    container_name: express_app_prod
    # Un-comment ports if app IS the public entry point (without Nginx):
    # ports:
    #   - "8000:8000"
    env_file:
      - .env.production
    # Baked image is used; no volume mounts for source code in production
    networks:
      - prod-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ==========================================
  # 2. Nginx Reverse Proxy Service
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: nginx_prod
    ports:
      - "80:80"
      # - "443:443" # Enable for HTTPS SSL certificates
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - prod-network
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # 3. MySQL Database Service
  # ==========================================
  db:
    image: mysql:8.4
    container_name: mysql_db_prod
    # Database port 3306 is isolated within docker network for security (not published publicly)
    env_file:
      - .env.production
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-express_db}
      MYSQL_USER: ${DB_USER:-express_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root_password}
    volumes:
      - db_data_prod:/var/lib/mysql
    networks:
      - prod-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$${DB_PASSWORD:-root_password} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

# ==========================================
# Isolated Network & Persistent Volumes
# ==========================================
networks:
  prod-network:
    driver: bridge

volumes:
  db_data_prod:
